name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[api,dev]"
      - name: Tests
        run: pytest -q
      - name: Demo pipeline end to end
        run: python -m geo_tracker demo --out demo_output
      - name: rein (deterministic guardrails, fails on BLOCK)
        run: rein review .
      - name: Apps Script logic
        run: node apps_script/test_gs.js apps_script/Code.gs
      - name: n8n Code nodes on the shared cases
        run: node n8n/test_code_nodes.js

  wordpress:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wp: ["6.5.13", "7.1.3"]      # the oldest version the plugin claims, and the current one
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: PHP syntax and shared test cases
        run: |
          php -v && php -m | grep -iE "pdo_sqlite|mbstring"
          for f in wordpress-plugin/geo-signals/*.php wordpress-plugin/geo-signals/includes/*.php; do php -l "$f"; done
          php tests/php/test_signals.php
      - name: Real WordPress ${{ matrix.wp }} (SQLite) with the plugin
        run: WP_VERSION=${{ matrix.wp }} tests/wordpress/setup_wordpress.sh "$RUNNER_TEMP/wp" 8899
      - name: Python audit vs PHP plugin on the live site
        run: GEO_WP_URL=http://127.0.0.1:8899 GEO_WP_DIR="$RUNNER_TEMP/wp/site" pytest -q tests/test_wordpress_live.py

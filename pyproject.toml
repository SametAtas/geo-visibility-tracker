[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-visibility-tracker"
version = "0.1.0"
description = "Measure brand visibility in AI answers with honest uncertainty: mentions vs citations, Wilson intervals, significance tests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SametAtas" }]
dependencies = ["httpx>=0.27", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "pydantic>=2", "uvicorn>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "pydantic>=2", "rein-engine>=0.4"]

[project.scripts]
geo-tracker = "geo_tracker.cli:main"

[tool.setuptools]
packages = ["geo_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
